# External network configuration for Traefik / Prometheus integration
# Usage: COMPOSE_FILE=tempo.yml:ext-network.yml in .env
#
# Make the external Traefik network the only network (the same pattern the other
# *-docker repos use). The fleet Prometheus (docker service discovery) is attached
# only to the Traefik network and keeps only the FIRST network of a container
# (match_first_network). With a second, project-internal network (tempo_default) the
# scrape address was an IP Prometheus cannot reach, so the target was always
# up == 0 (context deadline exceeded).

networks:
  default:
    name: ${DOCKER_EXT_NETWORK:-traefik_default}
    external: true
